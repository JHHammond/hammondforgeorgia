<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hammond for Georgia</title>
  <meta name="description" content="Hammond for Georgia. Coming in 2028.">
  <style>
    :root {
      --bg: #0f2341;
      --fg: #ffffff;
      --accent: #c8102e;
      --muted: #b9c4d6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .bar {
      width: 80px;
      height: 4px;
      background: var(--accent);
      margin: 24px auto;
    }
    p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: clamp(1rem, 3vw, 1.4rem);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hammond<br>for Georgia</h1>
    <div class="bar"></div>
    <p>Coming in 2028</p>
  </main>
</body>
</html>
